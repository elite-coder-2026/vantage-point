{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset password</h1>
<form action="/reset-password/{{ token }}" method="post" class="stacked-form">
  <label>New password <input type="password" name="new_password" required autofocus></label>
  <label>Confirm new password <input type="password" name="confirm_new_password" required></label>
  <button type="submit">Reset password</button>
</form>
{% endblock %}
