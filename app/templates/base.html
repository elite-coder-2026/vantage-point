<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vantage Point{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
  {% if current_user %}
  <div class="app-layout">
    <nav class="sidebar">
      <a class="brand" href="/">Vantage Point</a>
      <a class="sidebar-link" href="/"><span class="sidebar-icon">⌂</span> Home</a>
      <a class="sidebar-link" href="/notifications">
        <span class="sidebar-icon">♡{% if current_user.has_unread_notifications %}<span class="notif-dot"></span>{% endif %}</span>
        Notifications
      </a>
      <a class="sidebar-link" href="/u/{{ current_user.username }}"><span class="sidebar-icon">☺</span> Profile</a>
      <a class="sidebar-link" href="/settings"><span class="sidebar-icon">⚙</span> Settings</a>
      <form action="/logout" method="post">
        <button type="submit" class="sidebar-link sidebar-logout"><span class="sidebar-icon">⏻</span> Log out</button>
      </form>
    </nav>
  {% else %}
  <header class="site-header">
    <a class="brand" href="/">Vantage Point</a>
    <nav>
      <a href="/login">Log in</a>
      <a href="/register">Register</a>
    </nav>
  </header>
  {% endif %}
    <main class="{{ 'wide' if wide_main else '' }}">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
  {% if current_user %}
  </div>
  {% endif %}
  <script src="/static/app.js?v=3"></script>
</body>
</html>
